# Netlify settings. Other hosts ignore this file.

# Browsers keep the hero video for a year, so returning visitors don't download it again.
# When the video is replaced, give the new files new names (for example hero-plantroom-2.mp4)
# and update the names in tools/build.mjs, or returning visitors will keep seeing the old one.
[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Old Squarespace page addresses (hanntec.com before November 2026) sent to their new pages,
# so links in Google, old emails and quotes keep working. 301 = moved permanently.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
[[redirects]]
  from = "/about-us"
  to = "/about.html"
  status = 301
[[redirects]]
  from = "/contact-us"
  to = "/contact.html"
  status = 301
[[redirects]]
  from = "/technical-services"
  to = "/services.html"
  status = 301
[[redirects]]
  from = "/structured-cabling-fibre-optics"
  to = "/services.html#electrical"
  status = 301
[[redirects]]
  from = "/perimeter-security"
  to = "/services.html"
  status = 301
[[redirects]]
  from = "/privacy-policy"
  to = "/privacy.html"
  status = 301
[[redirects]]
  from = "/cookies-policy"
  to = "/privacy.html"
  status = 301
# No terms page on the new site yet; change this if one is added.
[[redirects]]
  from = "/terms-conditions"
  to = "/contact.html"
  status = 301
# The old security blog was not carried over.
[[redirects]]
  from = "/blog"
  to = "/"
  status = 301
[[redirects]]
  from = "/blog/*"
  to = "/"
  status = 301
